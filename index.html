  <style>
    :root {
      --tg-bg: #17212b;
      --tg-surface: #1e2b39;
      --tg-surface-2: #223245;
      --tg-line: #2a3d52;
      --tg-chip: #253646;
      --tg-text: #f4f7fb;
      --tg-muted: #9eb0c3;
      --tg-blue: #43a9ff;
      --tg-yellow: #facc15;
    }

    body {
      background: #0d1620;
      color: var(--tg-text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    *::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .app-shell {
      min-height: 100dvh;
      background: var(--tg-bg);
    }

    .telegram-panel {
      background: var(--tg-surface);
      border: 1px solid var(--tg-line);
    }

    .chip {
      background: var(--tg-chip);
      color: #d7e4f1;
    }

    .chip.active {
      background: #31475d;
      color: #fff;
    }

    .product-image {
      aspect-ratio: 3 / 4;
      object-fit: cover;
    }

    .heart svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .heart.active {
      color: #ff4f7a;
    }

    .heart.active svg {
      fill: #ff4f7a;
      stroke: #ff4f7a;
    }

    .toast {
      transform: translateY(120%);
      opacity: 0;
      transition: transform .25s ease, opacity .25s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .fade-in {
      animation: fadeIn .25s ease;
    }

    .sheet {
      transform: translateY(100%);
      transition: transform .28s ease;
    }

    .sheet.open {
      transform: translateY(0);
    }

    .modal-pop {
      opacity: 0;
      transform: translate(-50%, -48%) scale(0.96);
      transition: opacity .2s ease, transform .22s ease;
      pointer-events: none;
    }

    .modal-pop.open {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .filter-row {
      cursor: grab;
      user-select: none;
      touch-action: pan-y;
    }

    .filter-row.dragging {
      cursor: grabbing;
    }

    .slider-track {
      transition: transform .45s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }


    .kip-shimmer {
      background: linear-gradient(110deg, #fde047 0%, #fff7bf 30%, #fde047 55%, #fff7bf 75%, #fde047 100%);
      background-size: 220% 100%;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: kipShimmer 2.1s linear infinite;
      text-shadow: 0 0 10px rgba(253, 224, 71, 0.35);
    }

    .brand-shimmer {
      background: linear-gradient(110deg, #facc15 0%, #ffe27a 28%, #fff7cf 52%, #ffd54f 76%, #facc15 100%);
      background-size: 220% 100%;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: brandShimmer 7.2s ease-in-out infinite;
      font-weight: 800;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes kipShimmer {
      from { background-position: 200% 0; }
      to { background-position: -20% 0; }
    }

    @keyframes brandShimmer {
      from { background-position: 220% 0; }
      to { background-position: -20% 0; }
    }
  </style>
</head>

    const view = document.getElementById('view');
    const toast = document.getElementById('toast');
    const cartBadge = document.getElementById('cartBadge');
    const sortOverlay = document.getElementById('sortOverlay');
    const sortSheet = document.getElementById('sortSheet');
    const sortOptions = document.getElementById('sortOptions');
    const categoryOverlay = document.getElementById('categoryOverlay');
    const categorySheet = document.getElementById('categorySheet');
    const categoryOptions = document.getElementById('categoryOptions');
    const checkoutOverlay = document.getElementById('checkoutOverlay');
    const checkoutSheet = document.getElementById('checkoutSheet');
    const checkoutMessage = document.getElementById('checkoutMessage');
    const successOverlay = document.getElementById('successOverlay');
    const successModal = document.getElementById('successModal');

    function formatPrice(value) {
      return value.toLocaleString('ru-RU') + ' ₽';
    }

    function getCartItems() {
      return [...state.cart.entries()]
        .map(([id, qty]) => ({ product: getProductById(id), qty }))
        .filter((item) => item.product);
    }

    function getCartPricing() {
      const subtotal = getCartItems().reduce((sum, item) => sum + item.product.price * item.qty, 0);
      const discount = state.promo.applied ? Math.round(subtotal * 0.15) : 0;
      return { subtotal, discount, total: subtotal - discount };
    }

    function saveSearchHistory() {
      localStorage.setItem('discountshop_search_history', JSON.stringify(state.searchHistory));
    }

    function loadSearchHistory() {
      try {
        const raw = localStorage.getItem('discountshop_search_history');
        const parsed = raw ? JSON.parse(raw) : [];
        state.searchHistory = Array.isArray(parsed) ? parsed.slice(0, 8) : [];
      } catch (_) {
        state.searchHistory = [];
      }
    }

    function addSearchHistory(query) {
      const value = query.trim();
      if (!value) return;
      state.searchHistory = [value, ...state.searchHistory.filter((item) => item.toLowerCase() !== value.toLowerCase())].slice(0, 8);
      saveSearchHistory();
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizeName(value) {
      return value.replace(/\d+/g, '').replace(/[^A-Za-zА-Яа-яЁё\s-]/g, '');
    }

    function formatPhone(value) {
      const digits = value.replace(/\D/g, '');
      if (!digits.length) return '';
      let normalized = digits;
      if (normalized.startsWith('8')) normalized = '7' + normalized.slice(1);
      if (!normalized.startsWith('7')) normalized = '7' + normalized;
      normalized = normalized.slice(0, 11);
      const local = normalized.slice(1);
      const p1 = local.slice(0, 3);
      const p2 = local.slice(3, 6);
      const p3 = local.slice(6, 8);
      const p4 = local.slice(8, 10);
      let result = '+7';
      if (p1) result += ' ' + p1;
      if (p2) result += ' ' + p2;
      if (p3) result += ' ' + p3;
      if (p4) result += ' ' + p4;
      return result;
    }

    async function copyPromoCode() {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText('KIP');
        } else {
          const temp = document.createElement('textarea');
          temp.value = 'KIP';
          temp.style.position = 'fixed';
          temp.style.opacity = '0';
          document.body.appendChild(temp);
          temp.focus();
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
        }
        showToast('Промокод успешно скопирован!');
      } catch (_) {
        showToast('Не удалось скопировать промокод');
      }
    }

    function getProductById(id) {
      return products.find((item) => item.id === id) || null;
    }

    function getCartCount() {
      let count = 0;
      for (const qty of state.cart.values()) count += qty;
      return count;
    }

    function getFilteredProducts() {
      let list = [...products];

      if (state.category !== 'Все') {
        list = list.filter((item) => item.category === state.category);
      }
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        list = list.filter((item) => item.name.toLowerCase().includes(q));
      }

      if (state.sort === 'asc') list.sort((a, b) => a.price - b.price);
      if (state.sort === 'desc') list.sort((a, b) => b.price - a.price);
      if (state.sort === 'popular') list.sort((a, b) => b.popularity - a.popularity);
      if (state.sort === 'new') list.sort((a, b) => Number(b.isNew) - Number(a.isNew));

      return list;
    }

              <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9-8.5C1.3 8.2 3.3 5 6.8 5c2.1 0 3.6 1.2 5.2 3.1C13.6 6.2 15.1 5 17.2 5 20.7 5 22.7 8.2 21 11.5 19 15.4 12 20 12 20z"></path></svg>

            </div>

    function renderHome() {
      const list = CATALOG_VISIBLE ? getFilteredProducts() : [];
      return `
        <section class="p-3 fade-in">
          ${renderPromo()}
          <div id="filterRow" class="filter-row flex items-center gap-2 mb-3 overflow-x-auto pb-1">

            ${categories.map((cat) => `<button data-cat="${cat}" class="chip category-quick rounded-full px-4 py-2 text-sm whitespace-nowrap ${state.category === cat ? 'active' : ''}">${cat}</button>`).join('')}
          </div>

          ${state.searchHistory.length ? `

    function renderFavorites() {

      const { subtotal, discount, total } = getCartPricing();

            <div class="mt-3 text-lg flex justify-between"><span>Товары (${getCartCount()})</span><span>${formatPrice(subtotal)}</span></div>

            <div class="mt-2 text-2xl font-bold flex justify-between"><span>Итого</span><span>${formatPrice(total)}</span></div>

      return `

    function renderProduct() {
      const product = getProductById(state.detailId);
      if (!product) {
        state.tab = 'home';

      const maxIndex = product.images.length - 1;

      return `

            </div>
          </div>
        </section>
      `;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1700);
    }

    function render() {
      const activeElement = document.activeElement;
      const preserveSearchFocus = activeElement && activeElement.id === 'searchInput';
      const searchCaret = preserveSearchFocus ? activeElement.selectionStart : null;

      renderTopBar();
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = state.search;
      const renderMap = {
        home: renderHome,
        favorites: renderFavorites,
        cart: renderCart,
        profile: renderProfile,
        product: renderProduct
      };
      view.innerHTML = renderMap[state.tab]();

      const visibleTab = state.tab === 'product' ? state.previousTab : state.tab;
      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.style.color = btn.dataset.tab === visibleTab ? 'var(--tg-blue)' : 'var(--tg-muted)';
      });

      const count = getCartCount();
      cartBadge.textContent = count;
      cartBadge.classList.toggle('hidden', count === 0);

      bindDynamicEvents();

      // Keep typing smooth: after rerender return focus/caret to search input.
      if (preserveSearchFocus && state.tab !== 'product') {
        const nextSearchInput = document.getElementById('searchInput');
        if (nextSearchInput) {
          nextSearchInput.focus();
          const pos = Math.min(searchCaret ?? state.search.length, state.search.length);
          nextSearchInput.setSelectionRange(pos, pos);
        }
      }
    }

    function openSortSheet() {
      state.pendingSort = state.sort;
      renderSortOptions();
      sortOverlay.classList.remove('hidden');
      requestAnimationFrame(() => sortSheet.classList.add('open'));
    }

    function closeSortSheet() {
      sortSheet.classList.remove('open');
      setTimeout(() => sortOverlay.classList.add('hidden'), 180);
    }

    function renderSortOptions() {
      sortOptions.innerHTML = Object.entries(sortLabels).map(([key, label]) => `
        <button data-sheet-sort="${key}" class="w-full text-left px-3 py-3 rounded-xl ${state.pendingSort === key ? 'bg-[var(--tg-surface-2)] text-white' : 'text-slate-300'}">${label}</button>
      `).join('');
    }

    function openCategorySheet() {
      state.pendingCategory = state.category;
      renderCategoryOptions();
      categoryOverlay.classList.remove('hidden');
      requestAnimationFrame(() => categorySheet.classList.add('open'));
    }

    function closeCategorySheet() {
      categorySheet.classList.remove('open');
      setTimeout(() => categoryOverlay.classList.add('hidden'), 180);
    }

    function syncRecipientInputs() {
      const fields = [
        ['receiverName', 'name'],
        ['receiverSurname', 'surname'],
        ['receiverPatronymic', 'patronymic'],
        ['receiverPhone', 'phone'],
        ['receiverAddress', 'address'],
        ['receiverZip', 'zip']
      ];

      fields.forEach(([id, key]) => {
        const input = document.getElementById(id);
        if (!input) return;
        input.value = state.recipient[key] || '';
      });
    }

    function openCheckoutSheet() {
      checkoutOverlay.classList.remove('hidden');
      requestAnimationFrame(() => checkoutSheet.classList.add('open'));
      checkoutMessage.textContent = '';
      checkoutMessage.className = 'text-sm mt-3 min-h-5';
      syncRecipientInputs();
    }

    function closeCheckoutSheet() {
      checkoutSheet.classList.remove('open');
      setTimeout(() => checkoutOverlay.classList.add('hidden'), 180);
    }

    function openSupportChat() {
      const supportUrl = 'https://t.me/silentiumxx';
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.openTelegramLink(supportUrl);
        setTimeout(() => tg.close(), 150);
        return;
      }
      window.location.href = supportUrl;
    }

    function openSuccessModal() {
      successOverlay.classList.remove('hidden');
      requestAnimationFrame(() => successModal.classList.add('open'));
    }

    function closeSuccessModal() {
      successModal.classList.remove('open');
      setTimeout(() => successOverlay.classList.add('hidden'), 180);
    }

    function renderCategoryOptions() {
      categoryOptions.innerHTML = ['Все', ...categories].map((cat) => `
        <button data-sheet-cat="${cat}" class="w-full text-left px-3 py-3 rounded-xl ${state.pendingCategory === cat ? 'bg-[var(--tg-surface-2)] text-white' : 'text-slate-300'}">${cat}</button>
      `).join('');
    }

    function openProduct(id) {
      state.previousTab = state.tab === 'product' ? state.previousTab : state.tab;
      state.tab = 'product';
      state.detailId = id;
      state.detailSlide = 0;
      render();
    }

    function setupFilterRowDrag() {
      const row = document.getElementById('filterRow');
      if (!row) return;

      let pressed = false;
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let startScroll = 0;
      let movedAt = 0;

      row.addEventListener('pointerdown', (event) => {
        pressed = true;
        dragging = false;
        startX = event.clientX;
        startY = event.clientY;
        startScroll = row.scrollLeft;
      });

      row.addEventListener('pointermove', (event) => {
        if (!pressed) return;
        const deltaX = event.clientX - startX;
        const deltaY = event.clientY - startY;
        if (!dragging && Math.abs(deltaX) > 14 && Math.abs(deltaX) > Math.abs(deltaY)) {
          dragging = true;
        }
        if (dragging) {
          row.classList.add('dragging');
          row.scrollLeft = startScroll - deltaX;
          movedAt = Date.now();
          event.preventDefault();
        }
      });

      const stopDrag = () => {
        if (dragging) filterClickBlockUntil = movedAt + 180;
        pressed = false;
        dragging = false;
        row.classList.remove('dragging');
      };

      row.addEventListener('pointerup', stopDrag);
      row.addEventListener('pointercancel', stopDrag);

      row.addEventListener('click', (event) => {
        if (Date.now() < filterClickBlockUntil) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    }

    function bindDynamicEvents() {
      const searchInputEl = document.getElementById('searchInput');
      if (searchInputEl && !searchInputEl.dataset.bound) {
        searchInputEl.dataset.bound = '1';
        searchInputEl.addEventListener('input', (event) => {
          state.search = event.target.value;
          if (state.tab !== 'home') {
            state.tab = 'home';
            render();
            return;
          }

          // Update only catalog content while typing to avoid input glitches.
          view.innerHTML = renderHome();
          bindDynamicEvents();
        });

        searchInputEl.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter') return;
          addSearchHistory(event.target.value);
          render();
        });

        searchInputEl.addEventListener('blur', (event) => {
          addSearchHistory(event.target.value);
        });
      }

      document.querySelectorAll('[data-history-query]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.search = btn.dataset.historyQuery;
          render();
        });
      });

      document.querySelector('[data-clear-history]')?.addEventListener('click', () => {
        state.searchHistory = [];
        saveSearchHistory();
        render();
      });

      document.getElementById('backToList')?.addEventListener('click', () => {
        state.tab = state.previousTab || 'home';
        render();
      });

      document.getElementById('copyPromoBtn')?.addEventListener('click', copyPromoCode);

      document.getElementById('sortBtn')?.addEventListener('click', openSortSheet);
      document.getElementById('openCategories')?.addEventListener('click', openCategorySheet);

      document.querySelectorAll('[data-cat]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.category = btn.dataset.cat;
          render();
        });
      });

      document.querySelectorAll('[data-open]').forEach((card) => {
        card.addEventListener('click', () => openProduct(Number(card.dataset.open)));
      });

      document.querySelectorAll('[data-fav]').forEach((btn) => {
        btn.addEventListener('click', (event) => {
          event.stopPropagation();
          const id = Number(btn.dataset.fav);
          if (state.favorites.has(id)) {
            state.favorites.delete(id);
            showToast('Товар удален из избранных');
          } else {
            state.favorites.add(id);
            showToast('Товар успешно добавлен в избранные');
          }
          render();
        });
      });

      document.querySelectorAll('[data-add]').forEach((btn) => {
        btn.addEventListener('click', (event) => {
          event.stopPropagation();
          const id = Number(btn.dataset.add);
          state.cart.set(id, (state.cart.get(id) || 0) + 1);
          showToast('Товар добавлен в корзину');
          render();
        });
      });

      document.getElementById('goHomeFav')?.addEventListener('click', () => {
        state.tab = 'home';
        render();
      });

      document.getElementById('goHomeCart')?.addEventListener('click', () => {
        state.tab = 'home';
        render();
      });

      document.getElementById('historyBtn')?.addEventListener('click', () => {
        state.profileScreen = 'orders';
        render();
      });

      document.getElementById('supportBtn')?.addEventListener('click', openSupportChat);

      document.getElementById('profileBack')?.addEventListener('click', () => {
        state.profileScreen = 'main';
        render();
      });

      document.getElementById('clearCart')?.addEventListener('click', () => {
        state.cart.clear();
        showToast('Корзина очищена');
        render();
      });

      document.getElementById('checkoutBtn')?.addEventListener('click', openCheckoutSheet);

      document.querySelectorAll('[data-plus]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = Number(btn.dataset.plus);
          state.cart.set(id, (state.cart.get(id) || 0) + 1);
          render();
        });
      });

      document.querySelectorAll('[data-minus]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = Number(btn.dataset.minus);
          const next = (state.cart.get(id) || 0) - 1;
          if (next <= 0) {
            state.cart.delete(id);
            showToast('Товар был удален из корзины');
          } else {
            state.cart.set(id, next);
          }
          render();
        });
      });

      const promoInput = document.getElementById('promoInput');
      if (promoInput) {
        promoInput.value = state.promo.value;
        promoInput.addEventListener('input', (event) => {
          state.promo.value = event.target.value;
          state.promo.status = 'idle';
          state.promo.applied = false;
        });
      }

      document.getElementById('applyPromo')?.addEventListener('click', () => {
        const code = state.promo.value.trim();
        if (code === 'KIP') {
          state.promo.applied = true;
          state.promo.status = 'success';
        } else {
          state.promo.applied = false;
          state.promo.status = 'error';
        }
        render();
      });

      document.getElementById('prevSlide')?.addEventListener('click', () => {
        const product = getProductById(state.detailId);
        if (!product) return;
        state.detailSlide = (state.detailSlide - 1 + product.images.length) % product.images.length;
        render();
      });

      document.getElementById('nextSlide')?.addEventListener('click', () => {
        const product = getProductById(state.detailId);
        if (!product) return;
        state.detailSlide = (state.detailSlide + 1) % product.images.length;
        render();
      });

      document.querySelectorAll('[data-dot]').forEach((dot) => {
        dot.addEventListener('click', () => {
          state.detailSlide = Number(dot.dataset.dot);
          render();
        });
      });

      const addDetailBtn = document.querySelector('[data-add-detail]');
      addDetailBtn?.addEventListener('click', () => {
        const id = Number(addDetailBtn.dataset.addDetail);
        state.cart.set(id, (state.cart.get(id) || 0) + 1);
        showToast('Товар добавлен в корзину');
        render();
      });

      const sliderTrack = document.getElementById('sliderTrack');
      if (sliderTrack) {
        let startX = 0;
        sliderTrack.addEventListener('touchstart', (event) => {
          startX = event.touches[0].clientX;
        }, { passive: true });
        sliderTrack.addEventListener('touchend', (event) => {
          const product = getProductById(state.detailId);
          if (!product) return;
          const delta = event.changedTouches[0].clientX - startX;
          if (Math.abs(delta) < 35) return;
          if (delta < 0) state.detailSlide = (state.detailSlide + 1) % product.images.length;
          else state.detailSlide = (state.detailSlide - 1 + product.images.length) % product.images.length;
          render();
        }, { passive: true });
      }

      [
        ['receiverName', 'name'],
        ['receiverSurname', 'surname'],
        ['receiverPatronymic', 'patronymic']
      ].forEach(([id, key]) => {
        const input = document.getElementById(id);
        if (!input || input.dataset.bound) return;
        input.dataset.bound = '1';
        input.addEventListener('input', (event) => {
          const clean = sanitizeName(event.target.value);
          event.target.value = clean;
          state.recipient[key] = clean;
          checkoutMessage.textContent = '';
        });
      });

      const phoneInput = document.getElementById('receiverPhone');
      if (phoneInput && !phoneInput.dataset.bound) {
        phoneInput.dataset.bound = '1';
        phoneInput.addEventListener('input', (event) => {
          const formatted = formatPhone(event.target.value);
          event.target.value = formatted;
          state.recipient.phone = formatted;
          checkoutMessage.textContent = '';
        });
      }

      const addressInput = document.getElementById('receiverAddress');
      if (addressInput && !addressInput.dataset.bound) {
        addressInput.dataset.bound = '1';
        addressInput.addEventListener('input', (event) => {
          state.recipient.address = event.target.value;
          checkoutMessage.textContent = '';
        });
      }

      const zipInput = document.getElementById('receiverZip');
      if (zipInput && !zipInput.dataset.bound) {
        zipInput.dataset.bound = '1';
        zipInput.addEventListener('input', (event) => {
          const clean = event.target.value.replace(/\D/g, '').slice(0, 6);
          event.target.value = clean;
          state.recipient.zip = clean;
          checkoutMessage.textContent = '';
        });
      }

      const submitOrderBtn = document.getElementById('submitOrder');
      if (submitOrderBtn && !submitOrderBtn.dataset.bound) {
        submitOrderBtn.dataset.bound = '1';
        submitOrderBtn.addEventListener('click', () => {
        const { name, surname, patronymic, phone, address, zip } = state.recipient;
        const fioRegex = /^[A-Za-zА-Яа-яЁё\s-]+$/;
        const phoneRegex = /^\+7\s\d{3}\s\d{3}\s\d{2}\s\d{2}$/;
        const zipRegex = /^\d{6}$/;

        if (!name.trim() || !surname.trim() || !patronymic.trim() || !fioRegex.test(name) || !fioRegex.test(surname) || !fioRegex.test(patronymic)) {
          checkoutMessage.textContent = 'Проверьте ФИО: только буквы без цифр.';
          checkoutMessage.className = 'text-sm mt-3 min-h-5 text-red-400';
          return;
        }
        if (!phoneRegex.test(phone)) {
          checkoutMessage.textContent = 'Проверьте номер телефона: формат +7 999 999 99 99.';
          checkoutMessage.className = 'text-sm mt-3 min-h-5 text-red-400';
          return;
        }
        if (!address.trim()) {
          checkoutMessage.textContent = 'Введите адрес получателя.';
          checkoutMessage.className = 'text-sm mt-3 min-h-5 text-red-400';
          return;
        }
        if (!zipRegex.test(zip)) {
          checkoutMessage.textContent = 'Индекс должен содержать ровно 6 цифр.';
          checkoutMessage.className = 'text-sm mt-3 min-h-5 text-red-400';
          return;
        }

        const pricing = getCartPricing();
        const orderItems = getCartItems().map((item) => ({
          name: item.product.name,
          qty: item.qty
        }));
        state.orders.unshift({
          createdAt: new Date().toISOString(),
          items: orderItems,
          recipient: {
            fullName: `${surname} ${name} ${patronymic}`.trim(),
            address,
            zip
          },
          total: pricing.total
        });

        state.cart.clear();
        state.promo = { value: '', status: 'idle', applied: false };

        closeCheckoutSheet();
        openSuccessModal();
        });
      }

      setupFilterRowDrag();
    }

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.tab = btn.dataset.tab;
        if (state.tab === 'profile') state.profileScreen = 'main';
        render();
      });
    });

    sortOptions.addEventListener('click', (event) => {
      const target = event.target.closest('[data-sheet-sort]');
      if (!target) return;
      state.pendingSort = target.dataset.sheetSort;
      renderSortOptions();
    });

    categoryOptions.addEventListener('click', (event) => {
      const target = event.target.closest('[data-sheet-cat]');
      if (!target) return;
      state.pendingCategory = target.dataset.sheetCat;
      renderCategoryOptions();
    });

    sortOverlay.addEventListener('click', closeSortSheet);
    document.getElementById('cancelSort').addEventListener('click', closeSortSheet);
    document.getElementById('applySort').addEventListener('click', () => {
      state.sort = state.pendingSort;
      closeSortSheet();
      render();
    });

    categoryOverlay.addEventListener('click', closeCategorySheet);
    document.getElementById('cancelCategories').addEventListener('click', closeCategorySheet);
    document.getElementById('applyCategories').addEventListener('click', () => {
      state.category = state.pendingCategory;
      closeCategorySheet();
      render();
    });

    checkoutOverlay.addEventListener('click', closeCheckoutSheet);
    document.getElementById('closeCheckout').addEventListener('click', closeCheckoutSheet);

    successOverlay.addEventListener('click', closeSuccessModal);
    document.getElementById('closeSuccess').addEventListener('click', closeSuccessModal);

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      const tgUser = tg.initDataUnsafe?.user;
      if (tgUser) {
        state.user.name = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || 'Telegram User';
        state.user.username = tgUser.username ? '@' + tgUser.username : 'Telegram';
        state.user.photo = tgUser.photo_url || '';
      }
    }

    loadSearchHistory();
    render();
  </script>
</body>
</html>
